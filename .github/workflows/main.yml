name: "CustomDopamine: build"

# Adapted from opa334/Dopamine's own upstream CI (.github/workflows/main.yml),
# which is what their real releases are built with -- a genuine macOS runner
# with real Xcode, not a cross-compile toolchain. This sidesteps every
# Linux-specific problem from local development (xcrun shims, -target
# triples, the SwiftPM unknownOS bug, Dispatch module collisions, etc.)
# because none of those exist on a real Darwin host to begin with.

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@main
        with:
            submodules: recursive

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      - name: Build and Install trustcache
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: Download AppSync Unified for iOS 15 arm64
        run: |
          set -x
          # Fetch AppSync Unified from Karen's cydia repo (cydia.akemi.ai)
          PKGS_URL="https://cydia.akemi.ai/Packages.gz"
          APPSYNC_PATH=$(curl -sf "$PKGS_URL" | gzip -d 2>/dev/null | grep -A 30 "^Package: ai.akemi.appsyncunified$" | grep "^Filename:" | head -1 | awk '{print $2}')
          if [ -n "$APPSYNC_PATH" ]; then
            curl -L "https://cydia.akemi.ai/$APPSYNC_PATH" -o Application/Dopamine/Resources/AppSync.deb
          else
            # Fallback: fetch directly from AppSync GitHub releases
            curl -sL https://api.github.com/repos/akemin-dayo/AppSync/releases/latest \
              | grep "browser_download_url.*iphoneos-arm64.deb" \
              | cut -d '"' -f 4 \
              | xargs -I{} curl -L {} -o Application/Dopamine/Resources/AppSync.deb
          fi
          ls -la Application/Dopamine/Resources/AppSync.deb

      - name: Download Bootstrap
        run: |
            set -x
            cd Application/Dopamine/Resources
            chmod +x download_bootstraps.sh
            ./download_bootstraps.sh

      - name: Build
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          gmake -j$(sysctl -n hw.logicalcpu)

      - name: Upload Artifact
        id: customdopamine-upload
        uses: actions/upload-artifact@main
        with:
          name: CustomDopamine
          path: |
            ${{ github.workspace }}/Application/Dopamine.ipa
